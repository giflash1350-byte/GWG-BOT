services:
  - type: worker
    name: gwg-discord-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:bot
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: gwg-postgres, property: connectionString }
      - key: DATABASE_SSL
        value: "false"
      - key: DISCORD_TOKEN
        sync: false
      - key: COMMAND_PREFIX
        value: gwg
  - type: web
    name: gwg-dashboard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:web
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase: { name: gwg-postgres, property: connectionString }
      - key: DATABASE_SSL
        value: "false"
      - key: ADMIN_API_TOKEN
        sync: false
  - type: pserv
    name: gwg-postgres
    plan: basic-256mb
    databaseName: gwg
    user: gwg
